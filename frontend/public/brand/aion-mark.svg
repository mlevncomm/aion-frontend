<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="AION">
  <title>AION</title>
  <defs>
    <!-- The product's own pearl: lavender through soft blue, lit from upper left. -->
    <radialGradient id="pearl" cx="38%" cy="30%" r="78%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="26%" stop-color="#e9e4ff"/>
      <stop offset="54%" stop-color="#bcb0ff"/>
      <stop offset="78%" stop-color="#8f86f0"/>
      <stop offset="100%" stop-color="#5d55b8"/>
    </radialGradient>
    <radialGradient id="sheen" cx="32%" cy="24%" r="42%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#cfc6ff"/>
      <stop offset="50%" stop-color="#8fb6ff"/>
      <stop offset="100%" stop-color="#7d6ee8"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="55%" stop-color="#8b7dff" stop-opacity=".30"/>
      <stop offset="100%" stop-color="#8b7dff" stop-opacity="0"/>
    </radialGradient>
    <!-- The ring passes BEHIND the sphere on the upper half; masking that arc
         is what makes the mark read as an orbit instead of a flat circle. -->
    <mask id="behind">
      <rect width="512" height="512" fill="#fff"/>
      <circle cx="256" cy="256" r="150" fill="#000"/>
    </mask>
  </defs>

  <circle cx="256" cy="256" r="236" fill="url(#halo)"/>

  <g transform="rotate(-24 256 256)">
    <ellipse cx="256" cy="256" rx="232" ry="95" fill="none" stroke="url(#ring)"
             stroke-width="16" stroke-linecap="round" opacity=".55" mask="url(#behind)"/>
  </g>

  <circle cx="256" cy="256" r="150" fill="url(#pearl)"/>
  <circle cx="256" cy="256" r="150" fill="url(#sheen)"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="#ffffff" stroke-opacity=".55" stroke-width="2"/>

  <!-- The front half of the orbit, drawn over the sphere. -->
  <g transform="rotate(-24 256 256)">
    <path d="M 24 256 A 232 95 0 0 0 488 256" fill="none" stroke="url(#ring)"
          stroke-width="16" stroke-linecap="round"/>
  </g>

</svg>
